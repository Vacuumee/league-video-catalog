<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>Course Viewer</title>
<style>
/* Layout: lesson list on the left, player on the right. On phones the player pins to the top and the list scrolls beneath it. */
:root{
  --bg:#111417; --panel:#171b1f; --raise:#1e2329; --line:#2a3037;
  --fg:#e9ecef; --muted:#9aa4af; --accent:#6fd0b8; --accent-ink:#06231c; --warn:#f0b35a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);height:100vh;height:100dvh}
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-width:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.main{display:flex;flex-direction:column;min-width:0;overflow:auto}

.sidehead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.9rem 1rem;background:var(--panel);border-bottom:1px solid var(--line)}
.sidehead h1{margin:0;font-size:1rem;font-weight:650;letter-spacing:.01em}

.btn{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:.4rem .75rem;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}

details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:.75rem;padding:.8rem 1rem;font-weight:600}
summary::-webkit-details-marker{display:none}
summary .count{color:var(--muted);font-weight:400;font-size:.85rem;white-space:nowrap}
.lessons{display:flex;flex-direction:column;padding-bottom:.4rem}
.lesson{display:grid;grid-template-columns:1rem minmax(0,1fr);column-gap:.65rem;row-gap:.35rem;align-items:start;text-align:left;width:100%;background:none;border:0;border-left:3px solid transparent;padding:.55rem 1rem .55rem .85rem;cursor:pointer;color:var(--fg)}
.lesson:hover{background:var(--raise)}
.lesson.on{background:var(--raise);border-left-color:var(--accent)}
.lesson .dot{width:.6rem;height:.6rem;margin-top:.4rem;border-radius:50%;border:1.5px solid var(--muted)}
.lesson .dot.done{background:var(--accent);border-color:var(--accent)}
.lesson .lt{overflow-wrap:anywhere}
.lesson .bar{grid-column:2;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.lesson .bar i{display:block;height:100%;width:0;background:var(--accent)}
.empty{padding:1rem;color:var(--muted)}

.stage{position:relative;background:#000;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px)}
video{display:block;width:100%;height:100%;background:#000}
.msg{position:absolute;left:50%;bottom:3.5rem;transform:translateX(-50%);max-width:calc(100% - 2rem);display:flex;align-items:center;gap:.75rem;padding:.55rem .85rem;border-radius:8px;background:rgba(17,20,23,.92);border:1px solid var(--line);font-size:.9rem}
.msg.err{border-color:var(--warn)}

.info{padding:.9rem 1rem 1.2rem;display:flex;flex-direction:column;gap:.75rem;padding-left:max(1rem,env(safe-area-inset-left,0px));padding-right:max(1rem,env(safe-area-inset-right,0px))}
.info h2{margin:0;font-size:1.15rem;line-height:1.3;text-wrap:balance}
.info .course{color:var(--muted);font-size:.85rem}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.ctl label{display:flex;align-items:center;gap:.4rem;color:var(--muted);font-size:.85rem}
select,input[type=text],textarea{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:.35rem .5rem}
.keys{color:var(--muted);font-size:.8rem}

dialog{width:min(640px,calc(100% - 2rem));background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:1.1rem}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 .5rem;font-size:1.05rem}
dialog p{margin:.25rem 0 .75rem;color:var(--muted);font-size:.88rem}
dialog code{background:var(--raise);padding:.05rem .3rem;border-radius:4px}
dialog textarea{width:100%;min-height:15rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem;resize:vertical}
dialog input[type=text]{width:100%}
.row{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;margin-top:.9rem}
.fieldlabel{display:block;margin:.8rem 0 .3rem;color:var(--muted);font-size:.85rem}
.dlgerr{color:var(--warn);min-height:1.2em;font-size:.88rem}

@media (max-width:820px){
  .app{display:flex;flex-direction:column;height:auto;min-height:100%}
  .main{order:-1;position:sticky;top:0;z-index:5;background:var(--bg);overflow:visible;padding-top:env(safe-area-inset-top,0px)}
  .stage{max-height:none}
  .side{border-right:0;border-top:1px solid var(--line);overflow:visible}
  .sidehead{position:static}
  .keys{display:none}
  .info{gap:.5rem;padding-top:.6rem;padding-bottom:.8rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Courses">
    <div class="sidehead">
      <h1>Courses</h1>
      <button class="btn" id="btnLib" type="button">Library</button>
    </div>
    <div id="list"></div>
  </aside>

  <main class="main">
    <div class="stage">
      <video id="v" controls playsinline preload="metadata"></video>
      <div class="msg" id="msg" hidden></div>
    </div>
    <div class="info">
      <div>
        <h2 id="title">Pick a lesson</h2>
        <div class="course" id="course"></div>
      </div>
      <div class="ctl">
        <button class="btn" id="prev" type="button">Previous</button>
        <button class="btn primary" id="next" type="button">Next</button>
        <label for="q">Quality
          <select id="q">
            <option value="480p">480p</option>
            <option value="720p">720p</option>
            <option value="1080p">1080p</option>
            <option value="4K">4K</option>
          </select>
        </label>
        <label for="sp">Speed
          <select id="sp"></select>
        </label>
        <label for="auto"><input type="checkbox" id="auto"> Play next automatically</label>
      </div>
      <div class="keys">Keys: space play/pause, left/right skip 5s, J/L skip 10s, N next, P previous, F fullscreen</div>
    </div>
  </main>
</div>

<dialog id="dlg">
  <h3>Library</h3>
  <p>One course per line starting with <code>#</code>, then one lesson per line as <code>Lesson title | video id</code>. A full video address also works in place of the id.</p>
  <textarea id="lib" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  <label class="fieldlabel" for="base">Video address prefix</label>
  <input type="text" id="base" autocapitalize="off" autocomplete="off" spellcheck="false">
  <div class="dlgerr" id="dlgerr" role="alert"></div>
  <div class="row">
    <button class="btn" id="dlgCancel" type="button">Cancel</button>
    <button class="btn primary" id="dlgSave" type="button">Save</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(function () {
  "use strict";

  var QUALS = ["480p", "720p", "1080p", "4K"];
  var SPEEDS = [0.75, 1, 1.25, 1.5, 1.75, 2];
  var DEFAULT_BASE = "https://story.ddpanda.net/scload/";
  var SAMPLE = "# Sample course\nFirst lesson | 54q44khlyf-105\n";

  var $ = function (s) { return document.querySelector(s); };
  var v = $("#v"), list = $("#list"), msgEl = $("#msg");
  var titleEl = $("#title"), courseEl = $("#course");
  var qSel = $("#q"), spSel = $("#sp"), autoCb = $("#auto");
  var dlg = $("#dlg"), taLib = $("#lib"), baseIn = $("#base"), dlgErr = $("#dlgerr");

  var store = {
    get: function (k, d) {
      try { var r = localStorage.getItem("cv." + k); return r ? JSON.parse(r) : d; } catch (e) { return d; }
    },
    set: function (k, val) {
      try { localStorage.setItem("cv." + k, JSON.stringify(val)); } catch (e) {}
    }
  };

  var settings = Object.assign({ base: DEFAULT_BASE, quality: "1080p", speed: 1, auto: true, last: null }, store.get("settings", {}));
  var libText = store.get("library", null);
  if (typeof libText !== "string" || !libText.trim()) libText = SAMPLE;
  var prog = store.get("progress", {});

  var courses = [], flat = [], els = [];
  var cur = -1, activeQ = settings.quality;
  var hls = null, mediaRetries = 0, netRetries = 0, armed = false, lastSave = 0, msgTimer = 0;

  /* ---------- library parsing ---------- */
  function extractId(s) {
    s = (s || "").trim();
    var m = s.match(/scload\/([A-Za-z0-9_-]+?)(?:-(?:480p|720p|1080p|4K))?(?:[?#].*)?$/i);
    if (m) return m[1];
    return /^[A-Za-z0-9_-]+$/.test(s) ? s : null;
  }

  function parseLibrary(text) {
    var out = [], c = null;
    text.split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim();
      if (!line) return;
      if (line.charAt(0) === "#") {
        c = { title: line.replace(/^#+\s*/, "") || "Untitled course", lessons: [] };
        out.push(c);
        return;
      }
      var parts = line.split("|");
      var id = extractId(parts[parts.length - 1]);
      if (!id) return;
      var title = parts.length > 1 ? parts.slice(0, -1).join("|").trim() : id;
      if (!c) { c = { title: "Library", lessons: [] }; out.push(c); }
      c.lessons.push({ title: title || id, id: id });
    });
    return out.filter(function (x) { return x.lessons.length; });
  }

  function rebuild() {
    courses = parseLibrary(libText);
    flat = [];
    courses.forEach(function (c) {
      c.lessons.forEach(function (L) { flat.push({ title: L.title, id: L.id, course: c.title }); });
    });
    renderList();
  }

  /* ---------- lesson list ---------- */
  function paintItem(i) {
    var e = els[i]; if (!e) return;
    var p = prog[flat[i].id];
    var pct = p && p.d ? Math.min(100, Math.round((p.done ? 1 : p.t / p.d) * 100)) : 0;
    e.fill.style.width = pct + "%";
    e.dot.className = "dot" + (p && p.done ? " done" : "");
    e.btn.classList.toggle("on", i === cur);
    if (i === cur) e.btn.setAttribute("aria-current", "true"); else e.btn.removeAttribute("aria-current");
  }

  function renderList() {
    list.textContent = "";
    els = [];
    if (!flat.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No lessons yet. Open Library to add some.";
      list.appendChild(p);
      return;
    }
    var gi = 0;
    courses.forEach(function (c) {
      var d = document.createElement("details");
      var s = document.createElement("summary");
      var name = document.createElement("span");
      name.textContent = c.title;
      var count = document.createElement("span");
      count.className = "count";
      count.textContent = c.lessons.length + (c.lessons.length === 1 ? " lesson" : " lessons");
      s.appendChild(name); s.appendChild(count); d.appendChild(s);
      var box = document.createElement("div");
      box.className = "lessons";
      var holdsCur = false;
      c.lessons.forEach(function (L) {
        var i = gi++;
        if (i === cur) holdsCur = true;
        var b = document.createElement("button");
        b.type = "button"; b.className = "lesson";
        var dot = document.createElement("span"); dot.className = "dot";
        var t = document.createElement("span"); t.className = "lt"; t.textContent = L.title;
        var bar = document.createElement("span"); bar.className = "bar";
        var fill = document.createElement("i"); bar.appendChild(fill);
        b.appendChild(dot); b.appendChild(t); b.appendChild(bar);
        b.addEventListener("click", function () { select(i, { autoplay: true }); });
        box.appendChild(b);
        els[i] = { btn: b, fill: fill, dot: dot, det: d };
        paintItem(i);
      });
      d.appendChild(box);
      d.open = holdsCur || courses.length <= 3;
      list.appendChild(d);
    });
  }

  /* ---------- messages ---------- */
  function hideMsg() { clearTimeout(msgTimer); msgEl.hidden = true; msgEl.textContent = ""; msgEl.classList.remove("err"); }
  function toast(text, ms) {
    hideMsg();
    msgEl.textContent = text;
    msgEl.hidden = false;
    msgTimer = setTimeout(hideMsg, ms || 3500);
  }
  function failMsg(text) {
    hideMsg();
    msgEl.classList.add("err");
    var span = document.createElement("span"); span.textContent = text;
    var b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "Retry";
    b.addEventListener("click", function () { startLoad(v.currentTime || 0, true); });
    msgEl.appendChild(span); msgEl.appendChild(b);
    msgEl.hidden = false;
  }

  /* ---------- playback ---------- */
  function teardown() {
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    try { v.pause(); } catch (e) {}
    v.removeAttribute("src");
    try { v.load(); } catch (e) {}
  }

  function startLoad(start, autoplay) {
    var L = flat[cur]; if (!L) return;
    teardown(); hideMsg();
    mediaRetries = 0; netRetries = 0; armed = false;
    var url = settings.base + L.id + "-" + activeQ;
    qSel.value = activeQ;

    v.addEventListener("loadedmetadata", function () {
      if (start > 0 && isFinite(v.duration) && start < v.duration - 3) { try { v.currentTime = start; } catch (e) {} }
      v.playbackRate = settings.speed;
      armed = true;
    }, { once: true });

    var native = v.canPlayType("application/vnd.apple.mpegurl");
    if (native) {
      v.src = url;
      v.load();
    } else if (window.Hls && window.Hls.isSupported()) {
      hls = new window.Hls({ enableWorker: true, maxBufferLength: 40, backBufferLength: 60 });
      hls.on(window.Hls.Events.ERROR, function (ev, d) {
        if (!d.fatal) return;
        if (d.type === window.Hls.ErrorTypes.MEDIA_ERROR && mediaRetries++ < 2) { hls.recoverMediaError(); return; }
        if (d.type === window.Hls.ErrorTypes.NETWORK_ERROR && netRetries++ < 1) { hls.startLoad(); return; }
        onFail();
      });
      hls.loadSource(url);
      hls.attachMedia(v);
    } else {
      failMsg("This browser cannot play this kind of video.");
      return;
    }
    if (autoplay) { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); }
  }

  function onFail() {
    var qi = QUALS.indexOf(activeQ);
    var at = armed ? v.currentTime : 0;
    if (qi > 0) {
      var nq = QUALS[qi - 1];
      toast(activeQ + " did not load. Trying " + nq + ".", 4000);
      activeQ = nq;
      startLoad(at, true);
    } else {
      failMsg("The video did not load.");
    }
  }

  v.addEventListener("error", function () {
    if (!v.getAttribute("src")) return;
    onFail();
  });

  function select(i, opts) {
    if (i < 0 || i >= flat.length) return;
    saveProg(true);
    cur = i;
    var L = flat[i];
    settings.last = L.id; store.set("settings", settings);
    titleEl.textContent = L.title;
    courseEl.textContent = L.course;
    document.title = L.title + " | Course Viewer";
    els.forEach(function (_, k) { paintItem(k); });
    if (els[i] && els[i].det) els[i].det.open = true;
    activeQ = settings.quality;
    var p = prog[L.id];
    var start = p && !p.done && p.t > 5 ? p.t : 0;
    startLoad(start, !!(opts && opts.autoplay));
    updateNav();
    mediaSession(L);
  }

  function updateNav() {
    $("#prev").disabled = cur <= 0;
    $("#next").disabled = cur < 0 || cur >= flat.length - 1;
  }

  function mediaSession(L) {
    try {
      if (!("mediaSession" in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({ title: L.title, artist: L.course });
      navigator.mediaSession.setActionHandler("nexttrack", function () { select(cur + 1, { autoplay: true }); });
      navigator.mediaSession.setActionHandler("previoustrack", function () { select(cur - 1, { autoplay: true }); });
    } catch (e) {}
  }

  /* ---------- progress ---------- */
  function saveProg(force) {
    var L = flat[cur];
    if (!L || !armed || !isFinite(v.duration) || v.duration < 1) return;
    var now = Date.now();
    if (!force && now - lastSave < 2000) return;
    lastSave = now;
    var rec = prog[L.id] || {};
    rec.t = v.currentTime; rec.d = v.duration;
    if (rec.t / rec.d > 0.93) rec.done = true;
    prog[L.id] = rec;
    store.set("progress", prog);
    paintItem(cur);
  }

  v.addEventListener("timeupdate", function () { saveProg(false); });
  v.addEventListener("pause", function () { saveProg(true); });
  window.addEventListener("pagehide", function () { saveProg(true); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) saveProg(true); });

  v.addEventListener("ended", function () {
    var L = flat[cur]; if (!L) return;
    var rec = prog[L.id] || {};
    rec.done = true; rec.t = 0; rec.d = isFinite(v.duration) ? v.duration : rec.d;
    prog[L.id] = rec; store.set("progress", prog); paintItem(cur);
    if (settings.auto && cur + 1 < flat.length) {
      toast("Up next: " + flat[cur + 1].title, 2500);
      select(cur + 1, { autoplay: true });
    }
  });

  /* ---------- controls ---------- */
  SPEEDS.forEach(function (s) {
    var o = document.createElement("option");
    o.value = String(s); o.textContent = s + "x";
    spSel.appendChild(o);
  });
  spSel.value = String(settings.speed);
  qSel.value = settings.quality;
  autoCb.checked = !!settings.auto;

  qSel.addEventListener("change", function () {
    settings.quality = activeQ = qSel.value; store.set("settings", settings);
    if (cur >= 0) startLoad(armed ? v.currentTime : 0, !v.paused);
  });
  spSel.addEventListener("change", function () {
    settings.speed = parseFloat(spSel.value); store.set("settings", settings);
    v.playbackRate = settings.speed;
  });
  autoCb.addEventListener("change", function () { settings.auto = autoCb.checked; store.set("settings", settings); });
  $("#prev").addEventListener("click", function () { select(cur - 1, { autoplay: true }); });
  $("#next").addEventListener("click", function () { select(cur + 1, { autoplay: true }); });

  document.addEventListener("keydown", function (e) {
    var t = e.target && e.target.tagName;
    if (t === "TEXTAREA" || t === "INPUT" || t === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (dlg.open) return;
    var k = e.key.toLowerCase();
    if (k === " " || k === "k") { e.preventDefault(); if (v.paused) v.play().catch(function () {}); else v.pause(); }
    else if (e.key === "ArrowRight") { v.currentTime += 5; }
    else if (e.key === "ArrowLeft") { v.currentTime -= 5; }
    else if (k === "l") { v.currentTime += 10; }
    else if (k === "j") { v.currentTime -= 10; }
    else if (k === "n") { select(cur + 1, { autoplay: true }); }
    else if (k === "p") { select(cur - 1, { autoplay: true }); }
    else if (k === "f") {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (v.requestFullscreen) v.requestFullscreen().catch(function () {});
    }
  });

  /* ---------- library dialog ---------- */
  function openDlg() { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", ""); }
  function closeDlg() { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); }

  $("#btnLib").addEventListener("click", function () {
    taLib.value = libText; baseIn.value = settings.base; dlgErr.textContent = "";
    openDlg();
  });
  $("#dlgCancel").addEventListener("click", closeDlg);
  $("#dlgSave").addEventListener("click", function () {
    var parsed = parseLibrary(taLib.value);
    if (!parsed.length) { dlgErr.textContent = "No lessons found. Each lesson needs a video id."; return; }
    var base = baseIn.value.trim() || DEFAULT_BASE;
    if (!/^https?:\/\//i.test(base)) { dlgErr.textContent = "The address prefix must start with https://"; return; }
    if (base.charAt(base.length - 1) !== "/") base += "/";
    libText = taLib.value; settings.base = base;
    store.set("library", libText); store.set("settings", settings);
    var keepId = cur >= 0 && flat[cur] ? flat[cur].id : null;
    rebuild();
    var idx = -1;
    if (keepId) flat.some(function (L, i) { if (L.id === keepId) { idx = i; return true; } return false; });
    cur = idx;
    els.forEach(function (_, k) { paintItem(k); });
    updateNav();
    closeDlg();
  });

  /* ---------- start ---------- */
  rebuild();
  var startIdx = -1;
  if (settings.last) flat.some(function (L, i) { if (L.id === settings.last) { startIdx = i; return true; } return false; });
  if (startIdx >= 0) select(startIdx, { autoplay: false });
  else updateNav();
})();
</script>
</body>
</html>
